<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">Stronger vaccine protection lowers modelled community exposure</title>
<desc id="desc">At R0 6, exposure indices are 298 without vaccine protection, 74 at 60 percent efficacy, 30 at 70 percent, and 8 at 90 percent. The pre-Delta unvaccinated benchmark is 100.</desc>
<rect width="560" height="440" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#26383c">
<path d="M28 24h28" stroke="#506367" stroke-width="2" stroke-dasharray="5 4"/>
<text x="66" y="31" font-size="20">Pre-Delta benchmark = 100</text>
<text x="28" y="76" font-size="22">No vaccine protection</text>
<rect x="28" y="88" width="419.062" height="26" fill="#707b80"/>
<path d="M168.625 82v38" stroke="#26383c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="457.062" y="109" font-size="23" font-weight="700">298</text>
<text x="28" y="158" font-size="22">60% efficacy</text>
<rect x="28" y="170" width="104.062" height="26" fill="#6b9fa4"/>
<path d="M168.625 164v38" stroke="#26383c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="181" y="191" font-size="23" font-weight="700">74</text>
<text x="28" y="240" font-size="22">70% efficacy</text>
<rect x="28" y="252" width="41.906" height="26" fill="#317f87"/>
<path d="M168.625 246v38" stroke="#26383c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="79.906" y="273" font-size="23" font-weight="700">30</text>
<text x="28" y="322" font-size="22">90% efficacy</text>
<rect x="28" y="334" width="11.475" height="26" fill="#15525a"/>
<path d="M168.625 328v38" stroke="#26383c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="49.475" y="355" font-size="23" font-weight="700">8</text>
<path d="M28 380H478" stroke="#91a5a7"/>
<text x="28.0" y="407" text-anchor="middle" font-size="20">0</text>
<text x="168.625" y="407" text-anchor="middle" font-size="20">100</text>
<text x="309.25" y="407" text-anchor="middle" font-size="20">200</text>
<text x="449.875" y="407" text-anchor="middle" font-size="20">300</text>
<text x="253" y="436" text-anchor="middle" font-size="20">Modelled community exposure index</text>
</g></svg>
